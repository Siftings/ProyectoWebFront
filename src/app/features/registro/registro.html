<form class="tarjeta formulario" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <h1>Registrar empresa</h1>

  @if (creada(); as empresa) {
    <p class="alerta alerta-exito" role="status">
      Empresa {{ empresa.nombre }} registrada (NIT {{ empresa.nit }}). Su administrador es {{ empresa.emailAdmin }}.
    </p>
  }
  <app-alerta-error [mensaje]="error()" />

  <fieldset>
    <legend>Empresa</legend>

    <div class="campo">
      <label for="nombreEmpresa">Nombre</label>
      <input id="nombreEmpresa" type="text" formControlName="nombreEmpresa" autocomplete="organization" />
      <app-error-campo
        [mostrar]="form.controls.nombreEmpresa.touched && form.controls.nombreEmpresa.invalid"
        mensaje="Ingresa el nombre de la empresa."
        [servidor]="erroresCampo()['nombreEmpresa']"
      />
    </div>

    <div class="campo">
      <label for="nit">NIT</label>
      <input id="nit" type="text" formControlName="nit" autocomplete="off" />
      <app-error-campo
        [mostrar]="form.controls.nit.touched && form.controls.nit.invalid"
        mensaje="Ingresa el NIT."
        [servidor]="erroresCampo()['nit']"
      />
    </div>

    <div class="campo">
      <label for="correoContacto">Correo de contacto</label>
      <input id="correoContacto" type="email" formControlName="correoContacto" autocomplete="email" />
      <app-error-campo
        [mostrar]="form.controls.correoContacto.touched && form.controls.correoContacto.invalid"
        [mensaje]="
          form.controls.correoContacto.hasError('required')
            ? 'Ingresa el correo de contacto.'
            : 'Ingresa un correo válido.'
        "
        [servidor]="erroresCampo()['correoContacto']"
      />
    </div>
  </fieldset>

  <fieldset>
    <legend>Administrador</legend>

    <div class="campo">
      <label for="nombreAdmin">Nombre</label>
      <input id="nombreAdmin" type="text" formControlName="nombreAdmin" autocomplete="name" />
      <app-error-campo
        [mostrar]="form.controls.nombreAdmin.touched && form.controls.nombreAdmin.invalid"
        mensaje="Ingresa el nombre del administrador."
        [servidor]="erroresCampo()['nombreAdmin']"
      />
    </div>

    <div class="campo">
      <label for="emailAdmin">Correo</label>
      <input id="emailAdmin" type="email" formControlName="emailAdmin" autocomplete="username" />
      <app-error-campo
        [mostrar]="form.controls.emailAdmin.touched && form.controls.emailAdmin.invalid"
        [mensaje]="
          form.controls.emailAdmin.hasError('required')
            ? 'Ingresa el correo del administrador.'
            : 'Ingresa un correo válido.'
        "
        [servidor]="erroresCampo()['emailAdmin']"
      />
    </div>

    <div class="campo">
      <label for="passwordAdmin">Contraseña</label>
      <input id="passwordAdmin" type="password" formControlName="passwordAdmin" autocomplete="new-password" />
      <app-error-campo
        [mostrar]="form.controls.passwordAdmin.touched && form.controls.passwordAdmin.invalid"
        [mensaje]="
          form.controls.passwordAdmin.hasError('required')
            ? 'Ingresa una contraseña.'
            : 'La contraseña debe tener al menos 8 caracteres.'
        "
        [servidor]="erroresCampo()['passwordAdmin']"
      />
    </div>
  </fieldset>

  <button type="submit" class="btn-primario" [disabled]="enviando()">
    {{ enviando() ? 'Registrando…' : 'Registrar' }}
  </button>
</form>
