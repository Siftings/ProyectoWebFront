<header class="barra">
  <a class="marca" routerLink="/">Procesos BPMN</a>
  <nav class="menu" aria-label="Principal">
    @for (enlace of enlaces(); track enlace.ruta) {
      <a [routerLink]="enlace.ruta" routerLinkActive="activo">{{ enlace.texto }}</a>
    }
  </nav>
  <span class="usuario">
    {{ usuarioActual.usuario().email }} · {{ etiquetasRol[usuarioActual.rol()] }}
  </span>
</header>
<main class="contenido">
  <router-outlet />
</main>
