<form class="tarjeta formulario" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <h1>Nuevo usuario</h1>

  <app-alerta-error [mensaje]="error()" />

  <div class="campo">
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" formControlName="nombre" autocomplete="off" />
    <app-error-campo
      [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
      mensaje="Ingresa el nombre del usuario."
      [servidor]="erroresCampo()['nombre']"
    />
  </div>

  <div class="campo">
    <label for="email">Correo</label>
    <input id="email" type="email" formControlName="email" autocomplete="off" />
    <app-error-campo
      [mostrar]="form.controls.email.touched && form.controls.email.invalid"
      [mensaje]="form.controls.email.hasError('required') ? 'Ingresa el correo.' : 'Ingresa un correo válido.'"
      [servidor]="erroresCampo()['email']"
    />
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />
    <app-error-campo
      [mostrar]="form.controls.password.touched && form.controls.password.invalid"
      [mensaje]="
        form.controls.password.hasError('required')
          ? 'Ingresa una contraseña.'
          : 'La contraseña debe tener al menos 8 caracteres.'
      "
      [servidor]="erroresCampo()['password']"
    />
  </div>

  <div class="campo">
    <label for="rolAcceso">Rol</label>
    <select id="rolAcceso" formControlName="rolAcceso">
      @for (rol of roles; track rol[0]) {
        <option [value]="rol[0]">{{ rol[1] }}</option>
      }
    </select>
  </div>

  <button type="submit" class="btn-primario" [disabled]="enviando()">
    {{ enviando() ? 'Guardando…' : 'Guardar' }}
  </button>
  <p><a routerLink="/usuarios">Cancelar</a></p>
</form>
