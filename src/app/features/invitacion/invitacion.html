<div class="tarjeta formulario">
  <h1>Aceptar invitación</h1>
  @if (creado(); as usuario) {
    <p class="alerta alerta-exito" role="status">Cuenta creada para {{ usuario.email }}.</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <p>Elige tu nombre y una contraseña para crear tu cuenta.</p>

      <app-alerta-error [mensaje]="error()" />

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" formControlName="nombre" autocomplete="name" />
        <app-error-campo
          [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
          mensaje="Ingresa tu nombre."
          [servidor]="erroresCampo()['nombre']"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        <app-error-campo
          [mostrar]="form.controls.password.touched && form.controls.password.invalid"
          [mensaje]="
            form.controls.password.hasError('required')
              ? 'Ingresa una contraseña.'
              : 'La contraseña debe tener al menos 8 caracteres.'
          "
          [servidor]="erroresCampo()['password']"
        />
      </div>

      <button type="submit" class="btn-primario" [disabled]="enviando()">
        {{ enviando() ? 'Creando…' : 'Crear cuenta' }}
      </button>
    </form>
  }
</div>
