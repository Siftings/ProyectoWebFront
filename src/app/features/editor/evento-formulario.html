<form class="formulario" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <app-alerta-error [mensaje]="error()" />

  <div class="campo">
    <label for="ev-nombre">Nombre</label>
    <input id="ev-nombre" type="text" maxlength="255" formControlName="nombre" autocomplete="off" />
    <app-error-campo
      [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
      mensaje="Ingresa el nombre del evento."
      [servidor]="erroresCampo()['nombre']"
    />
  </div>

  <div class="campo">
    <label for="ev-tipo">Tipo</label>
    <select id="ev-tipo" formControlName="tipoEvento">
      @for (t of tipos; track t[0]) {
        <option [value]="t[0]">{{ t[1] }}</option>
      }
    </select>
    <app-error-campo [mostrar]="false" mensaje="" [servidor]="erroresCampo()['tipoEvento']" />
  </div>

  <div class="campo">
    <label for="ev-contenido">Contenido</label>
    <input id="ev-contenido" type="text" formControlName="contenido" autocomplete="off" />
    <app-error-campo
      [mostrar]="form.controls.contenido.touched && form.controls.contenido.invalid"
      mensaje="Ingresa el contenido del mensaje."
      [servidor]="erroresCampo()['contenido']"
    />
  </div>

  <div class="campo">
    <label for="ev-clave">Clave de correlación</label>
    <input id="ev-clave" type="text" formControlName="claveCorrelacion" autocomplete="off" />
    <app-error-campo
      [mostrar]="form.controls.claveCorrelacion.touched && form.controls.claveCorrelacion.invalid"
      mensaje="Ingresa la clave de correlación."
      [servidor]="erroresCampo()['claveCorrelacion']"
    />
  </div>

  <div class="campo">
    <label for="ev-externo">
      <input id="ev-externo" type="checkbox" formControlName="origenExterno" />
      Origen externo
    </label>
    <app-error-campo [mostrar]="false" mensaje="" [servidor]="erroresCampo()['origenExterno']" />
  </div>

  <div class="campo">
    <label for="ev-x">Posición X</label>
    <input id="ev-x" type="number" min="0" step="1" formControlName="posicionX" />
    <app-error-campo
      [mostrar]="form.controls.posicionX.touched && form.controls.posicionX.invalid"
      mensaje="Ingresa un número entero de 0 o más."
      [servidor]="erroresCampo()['posicionX']"
    />
  </div>

  <div class="campo">
    <label for="ev-y">Posición Y</label>
    <input id="ev-y" type="number" min="0" step="1" formControlName="posicionY" />
    <app-error-campo
      [mostrar]="form.controls.posicionY.touched && form.controls.posicionY.invalid"
      mensaje="Ingresa un número entero de 0 o más."
      [servidor]="erroresCampo()['posicionY']"
    />
  </div>

  <button type="submit" class="btn-primario" [disabled]="enviando()">
    {{ enviando() ? 'Guardando…' : 'Guardar' }}
  </button>
  @if (!evento()) {
    <button type="button" (click)="cancelar.emit()">Cancelar</button>
  }
</form>
