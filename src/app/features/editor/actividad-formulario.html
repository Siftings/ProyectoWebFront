<form class="formulario" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <app-alerta-error [mensaje]="error()" />

  <div class="campo">
    <label for="act-nombre">Nombre</label>
    <input
      id="act-nombre"
      type="text"
      maxlength="255"
      formControlName="nombre"
      autocomplete="off"
    />
    <app-error-campo
      [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
      mensaje="Ingresa el nombre de la actividad."
      [servidor]="erroresCampo()['nombre']"
    />
  </div>

  <div class="campo">
    <label for="act-tipo">Tipo</label>
    <select id="act-tipo" formControlName="tipoActividad">
      @for (t of tipos; track t[0]) {
        <option [value]="t[0]">{{ t[1] }}</option>
      }
    </select>
    <app-error-campo [mostrar]="false" mensaje="" [servidor]="erroresCampo()['tipoActividad']" />
  </div>

  <div class="campo">
    <label for="act-descripcion">Descripción</label>
    <textarea id="act-descripcion" rows="3" formControlName="descripcion"></textarea>
    <app-error-campo [mostrar]="false" mensaje="" [servidor]="erroresCampo()['descripcion']" />
  </div>

  <div class="campo">
    <label for="act-x">Posición X</label>
    <input id="act-x" type="number" min="0" step="1" formControlName="posicionX" />
    <app-error-campo
      [mostrar]="form.controls.posicionX.touched && form.controls.posicionX.invalid"
      mensaje="Ingresa un número entero de 0 o más."
      [servidor]="erroresCampo()['posicionX']"
    />
  </div>

  <div class="campo">
    <label for="act-y">Posición Y</label>
    <input id="act-y" type="number" min="0" step="1" formControlName="posicionY" />
    <app-error-campo
      [mostrar]="form.controls.posicionY.touched && form.controls.posicionY.invalid"
      mensaje="Ingresa un número entero de 0 o más."
      [servidor]="erroresCampo()['posicionY']"
    />
  </div>

  <button type="submit" class="btn-primario" [disabled]="enviando()">
    {{ enviando() ? 'Guardando…' : 'Guardar' }}
  </button>
  @if (!actividad()) {
    <button type="button" (click)="cancelar.emit()">Cancelar</button>
  }
</form>
