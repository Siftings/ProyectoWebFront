<form class="formulario" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <app-alerta-error [mensaje]="error()" />

  <div class="campo">
    <label for="lane-nombre">Nombre</label>
    <input
      id="lane-nombre"
      type="text"
      maxlength="255"
      formControlName="nombre"
      autocomplete="off"
    />
    <app-error-campo
      [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
      mensaje="Ingresa el nombre de la lane."
      [servidor]="erroresCampo()['nombre']"
    />
  </div>

  <div class="campo">
    <label for="lane-rol">Rol de proceso</label>
    @if (!cargandoRoles() && roles().length === 0) {
      <p>
        No hay roles de proceso.
        @if (esAdmin()) {
          <a routerLink="/roles/nuevo">Crear un rol</a>
        }
      </p>
    } @else {
      <select id="lane-rol" formControlName="rolProcesoId">
        <option [ngValue]="null">Selecciona un rol</option>
        @for (r of roles(); track r.id) {
          <option [ngValue]="r.id">{{ r.nombre }}</option>
        }
      </select>
    }
    <app-error-campo
      [mostrar]="form.controls.rolProcesoId.touched && form.controls.rolProcesoId.invalid"
      mensaje="Selecciona un rol de proceso."
      [servidor]="erroresCampo()['rolProcesoId']"
    />
  </div>

  <button type="submit" class="btn-primario" [disabled]="enviando()">
    {{ enviando() ? 'Guardando…' : 'Guardar' }}
  </button>
  @if (!lane()) {
    <button type="button" (click)="cancelar.emit()">Cancelar</button>
  }
</form>
