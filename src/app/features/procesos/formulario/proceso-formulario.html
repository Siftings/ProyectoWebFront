<div class="tarjeta formulario">
  <h1>{{ id === null ? 'Nuevo proceso' : 'Editar proceso' }}</h1>

  @if (cargando()) {
    <p>Cargando…</p>
  }
  <app-alerta-error [mensaje]="error()" />

  @if (cargado()) {
    @if (estado() === 'PUBLICADO') {
      <p class="alerta alerta-aviso">
        El proceso está publicado: solo se editan sus datos, no el diagrama.
      </p>
    }
    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" formControlName="nombre" autocomplete="off" />
        <app-error-campo
          [mostrar]="form.controls.nombre.touched && form.controls.nombre.invalid"
          mensaje="Ingresa el nombre del proceso."
          [servidor]="erroresCampo()['nombre']"
        />
      </div>

      <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="4" formControlName="descripcion"></textarea>
        <app-error-campo
          [mostrar]="form.controls.descripcion.touched && form.controls.descripcion.invalid"
          mensaje="Ingresa la descripción."
          [servidor]="erroresCampo()['descripcion']"
        />
      </div>

      <div class="campo">
        <label for="categoria">Categoría</label>
        <input id="categoria" type="text" formControlName="categoria" autocomplete="off" />
        <app-error-campo
          [mostrar]="form.controls.categoria.touched && form.controls.categoria.invalid"
          mensaje="Ingresa la categoría."
          [servidor]="erroresCampo()['categoria']"
        />
      </div>

      <button type="submit" class="btn-primario" [disabled]="enviando()">
        {{ enviando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </form>
  }
  <p><a routerLink="/procesos">Cancelar</a></p>
</div>
